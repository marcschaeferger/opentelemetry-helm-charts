name: Sync repository metadata to gh-pages

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'artifacthub-repo.yml'

jobs:
  sync:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy files to temp
        run: |
          cp -f README.md ${{ runner.temp }}/README.md
          cp -f artifacthub-repo.yml ${{ runner.temp }}/artifacthub-repo.yml

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Sync files and push
        run: |
          cp -f ${{ runner.temp }}/README.md .
          cp -f ${{ runner.temp }}/artifacthub-repo.yml .
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add README.md artifacthub-repo.yml
          git commit --signoff -m "Sync repository metadata from main" || exit 0
          git push
