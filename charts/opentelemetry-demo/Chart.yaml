apiVersion: v2
type: application
name: opentelemetry-demo
version: 0.41.1
description: opentelemetry demo helm chart
home: https://opentelemetry.io/
sources:
  - https://github.com/open-telemetry/opentelemetry-demo
maintainers:
  - name: dmitryax
  - name: jaronoff97
  - name: julianocosta89
  - name: puckpuck
  - name: tylerhelmuth
icon: https://opentelemetry.io/img/logos/opentelemetry-logo-nav.png
appVersion: 3.0.0
dependencies:
  - name: opentelemetry-collector
    version: 0.165.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: opentelemetry-collector.enabled
  - name: opentelemetry-collector
    version: 0.165.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: otel-ebpf-profiler.enabled
    alias: otel-ebpf-profiler
  - name: jaeger
    version: 4.11.1
    repository: https://jaegertracing.github.io/helm-charts
    condition: jaeger.enabled
  - name: prometheus
    version: 29.18.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: 12.7.2
    repository: https://grafana-community.github.io/helm-charts
    condition: grafana.enabled
  - name: opensearch
    version: 3.7.0
    repository: https://opensearch-project.github.io/helm-charts/
    condition: opensearch.enabled
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-demo
    - name: Chart releases
      url: https://github.com/open-telemetry/opentelemetry-helm-charts/releases?q=opentelemetry-demo&expanded=true
    - name: support
      url: https://github.com/open-telemetry/opentelemetry-helm-charts/issues
  artifacthub.io/signKey: |
    fingerprint: 809A5AC5DA08F79218A2962799CA262FF8EBBB9B
    url: https://open-telemetry.github.io/opentelemetry-helm-charts/pubkey.asc
